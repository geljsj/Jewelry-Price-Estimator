<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>주문 제작 견적서 (돈/g 환산)</title>
    <style>
        :root {
            --primary: #1c1c1e;
            --accent: #0071e3;
            --bg: #ffffff;
            --card: #ffffff;
            --border: #d2d2d7;
            --input-bg: #fbfbfd;
            --sub-text: #86868b;
            --gold: #b39a6a;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #f5f5f7;
                --accent: #0a84ff;
                --bg: #000000;
                --card: #000000;
                --border: #3a3a3c;
                --input-bg: #1c1c1e;
                --sub-text: #98989d;
                --gold: #d4bb8e;
            }
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; letter-spacing: -0.02em; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Pretendard", sans-serif; 
            background-color: var(--bg); margin: 0; padding: 0; color: var(--primary);
            line-height: 1.4; transition: all 0.3s ease;
        }

        .container { 
            width: 100%; max-width: 600px; margin: 0 auto; padding: 20px 16px;
        }

        .main-header { text-align: left; margin-bottom: 28px; padding-left: 4px; }
        .main-title { font-size: 1.8rem; font-weight: 800; margin: 0; }

        .section { margin-bottom: 32px; }
        
        .section-header { 
            font-size: 0.95rem; font-weight: 700; color: var(--gold);
            margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
            text-transform: uppercase; letter-spacing: 0.01em;
        }

        .grid-container {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
        }

        .input-group {
            background: var(--input-bg); padding: 12px; border-radius: 14px;
            border: 1px solid var(--border); transition: all 0.2s ease;
        }
        .input-group:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,113,227,0.1); }
        
        .input-group label {
            display: block; font-size: 0.7rem; color: var(--sub-text);
            margin-bottom: 6px; font-weight: 600;
        }
        .input-wrapper { display: flex; align-items: center; gap: 2px; }
        .input-wrapper span { font-size: 0.85rem; font-weight: 600; color: var(--primary); }

        input { 
            width: 100%; border: none; background: transparent;
            font-size: 1rem; font-weight: 700; color: var(--primary);
            outline: none; padding: 0;
        }

        .sub-total {
            grid-column: span 3; padding: 12px 4px 0;
            display: flex; justify-content: space-between; align-items: center;
        }
        .sub-total-label { font-size: 0.85rem; font-weight: 600; color: var(--sub-text); }
        .sub-total-val { font-size: 1.05rem; font-weight: 700; color: var(--primary); }

        .total-section {
            background: #1c1c1e; color: #ffffff;
            border-radius: 18px; padding: 24px; text-align: center;
            margin-top: 16px;
        }
        .final-price-label { font-weight: 600; font-size: 0.9rem; opacity: 0.7; margin-bottom: 8px; display: block; }
        .final-price-val { font-size: 2rem; color: #ffffff !important; font-weight: 800; }
        
        @media (prefers-color-scheme: dark) {
            .total-section { background: #2c2c2e; }
        }

        .margin-group { grid-column: span 1; }
        .cost-info-group { 
            grid-column: span 2; display: flex; flex-direction: column; justify-content: center;
            padding-left: 4px;
        }

        .formula-info {
            margin-top: 30px; padding: 16px; border-radius: 14px;
            background: var(--input-bg); border: 1px solid var(--border);
        }
        .formula-text { font-size: 0.75rem; color: var(--sub-text); text-align: center; line-height: 1.6; word-break: keep-all; }
        .formula-text b { font-weight: 800; color: var(--gold); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .container { animation: fadeIn 0.4s ease-out; }
    </style>
</head>
<body>

<div class="container">
    <div class="main-header">
        <h1 class="main-title">주문 제작 견적서</h1>
    </div>
    
    <div class="section">
        <div class="section-header">1. 재료비 산출</div>
        <div class="grid-container">
            <div class="input-group">
                <label>시세 (3.75g/돈)</label>
                <div class="input-wrapper"><span>₩</span><input type="text" id="marketPrice" inputmode="numeric" placeholder="0" oninput="handleInput(this)" onclick="this.select()"></div>
            </div>
            <div class="input-group">
                <label>중량 (g)</label>
                <div class="input-wrapper"><input type="text" id="weight" inputmode="decimal" placeholder="0" oninput="handleInput(this)" onclick="this.select()"><span>g</span></div>
            </div>
            <div class="input-group">
                <label>부자재</label>
                <div class="input-wrapper"><span>₩</span><input type="text" id="subMat" inputmode="numeric" placeholder="0" oninput="handleInput(this)" onclick="this.select()"></div>
            </div>
            <div class="sub-total">
                <div class="sub-total-label">재료비 소계</div>
                <div class="sub-total-val">₩ <span id="matSum">0</span></div>
            </div>
        </div>
    </div>

    <div class="section">
        <div class="section-header">2. 제작비 산출</div>
        <div class="grid-container">
            <div class="input-group">
                <label>디자인/모델링</label>
                <div class="input-wrapper"><span>₩</span><input type="text" id="design" inputmode="numeric" placeholder="0" oninput="handleInput(this)" onclick="this.select()"></div>
            </div>
            <div class="input-group">
                <label>세공/주조</label>
                <div class="input-wrapper"><span>₩</span><input type="text" id="craft" inputmode="numeric" placeholder="0" oninput="handleInput(this)" onclick="this.select()"></div>
            </div>
            <div class="input-group">
                <label>판관비</label>
                <div class="input-wrapper"><span>₩</span><input type="text" id="admin" inputmode="numeric" placeholder="0" oninput="handleInput(this)" onclick="this.select()"></div>
            </div>
            <div class="sub-total">
                <div class="sub-total-label">공임비 소계</div>
                <div class="sub-total-val">₩ <span id="laborSum">0</span></div>
            </div>
        </div>
    </div>

    <div class="section" style="margin-bottom: 0;">
        <div class="section-header">3. 최종 가격 산출</div>
        <div class="grid-container">
            <div class="cost-info-group">
                <span style="font-size: 0.75rem; color: var(--sub-text); font-weight: 600; margin-bottom: 2px;">제작 원가 합계</span>
                <span style="font-size: 1.1rem; font-weight: 800; color: var(--primary);">₩ <span id="totalCost">0</span></span>
            </div>
            <div class="input-group margin-group">
                <label>마진율(%)</label>
                <div class="input-wrapper"><input type="text" id="marginInput" value="100" inputmode="numeric" oninput="handleInput(this)" onclick="this.select()" style="color: var(--accent);"><span>%</span></div>
            </div>
        </div>
        
        <div class="total-section">
            <span class="final-price-label">최종 예상 판매가</span>
            <div class="final-price-val">₩ <span id="totalPrice">0</span></div>
        </div>
    </div>

    <div class="formula-info">
        <div class="formula-text">
            <b>💡최종가 산출 공식</b><br>
            [재료비((시세÷3.75)×중량 + 부자재) + 제작비(디자인+세공+판관)] × 마진율
        </div>
    </div>
</div>

<script>
    function formatNumber(n) {
        return n.replace(/\D/g, "").replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }

    function formatDecimal(n) {
        const parts = n.replace(/[^0-9.]/g, "").split(".");
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        if (parts.length > 2) return parts[0] + "." + parts[1];
        return parts.join(".");
    }

    function handleInput(el) {
        let val = el.value;
        if (el.id === 'weight') {
            el.value = formatDecimal(val);
        } else {
            el.value = formatNumber(val);
        }
        calculate();
    }

    function calculate() {
        const parseValue = (id) => {
            const val = document.getElementById(id).value.replace(/,/g, "");
            return parseFloat(val) || 0;
        };

        // 시세 입력값(돈 단위)을 가져와 3.75로 나누어 g당 시세로 환산
        const marketDon = parseValue('marketPrice');
        const marketGram = marketDon / 3.75;
        
        const weight = parseValue('weight');
        const subMat = parseValue('subMat');
        const design = parseValue('design');
        const craft = parseValue('craft');
        const admin = parseValue('admin');
        const marginVal = document.getElementById('marginInput').value.replace(/,/g, "");
        const margin = marginVal === "" ? 100 : parseFloat(marginVal);

        // 계산 로직 (환산된 g당 시세 사용)
        const matTotal = (marketGram * weight) + subMat;
        const laborTotal = design + craft + admin;
        const costSum = matTotal + laborTotal;
        const finalPrice = costSum * (1 + margin / 100);

        document.getElementById('matSum').innerText = Math.round(matTotal).toLocaleString();
        document.getElementById('laborSum').innerText = Math.round(laborTotal).toLocaleString();
        document.getElementById('totalCost').innerText = Math.round(costSum).toLocaleString();
        document.getElementById('totalPrice').innerText = Math.round(finalPrice).toLocaleString();
    }

    window.onload = calculate;
</script>

</body>
</html>
